name: Build Kiwigram Debug APK

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Accept Android SDK Licenses
        run: |
          yes | sdkmanager --licenses || true

      - name: Install Android SDK Components
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;27.2.12479018" \
            "cmake;3.22.1"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Make Gradlew Executable
        run: chmod +x ./gradlew

      - name: Ensure Gradle 8.13 Distribution Ready
        run: |
          DIST_DIR="$HOME/.gradle/wrapper/dists/gradle-8.13-bin/5xuhj0ry160q40clulazy9h7d"
          EXPECTED_SHA="20f1b1176237254a6fc204d8434196fa11a4cfb387567519c61556e8710aed78"

          if [ -f "$DIST_DIR/gradle-8.13-bin.zip.ok" ] && [ -d "$DIST_DIR/gradle-8.13" ]; then
            echo "Gradle 8.13 distribution already present and verified in cache."
          else
            mkdir -p "$DIST_DIR"
            NEED_DOWNLOAD=1
            if [ -f "$DIST_DIR/gradle-8.13-bin.zip" ]; then
              ACTUAL_SHA=$(sha256sum "$DIST_DIR/gradle-8.13-bin.zip" | awk '{print $1}')
              if [ "$ACTUAL_SHA" = "$EXPECTED_SHA" ]; then
                echo "Pre-existing gradle-8.13-bin.zip matches official SHA-256."
                NEED_DOWNLOAD=0
              else
                echo "Cached zip failed checksum, removing."
                rm -f "$DIST_DIR/gradle-8.13-bin.zip"
              fi
            fi

            if [ $NEED_DOWNLOAD -eq 1 ]; then
              echo "Downloading gradle-8.13-bin.zip from official Gradle distribution endpoints..."
              URLS=(
                "https://services.gradle.org/distributions/gradle-8.13-bin.zip"
                "https://downloads.gradle.org/distributions/gradle-8.13-bin.zip"
              )
              DOWNLOAD_SUCCESS=0
              for url in "${URLS[@]}"; do
                echo "Trying official endpoint: $url"
                if curl -fL --retry 3 --retry-delay 5 --retry-connrefused --connect-timeout 30 --max-time 300 -o "$DIST_DIR/gradle-8.13-bin.zip" "$url"; then
                  ACTUAL_SHA=$(sha256sum "$DIST_DIR/gradle-8.13-bin.zip" | awk '{print $1}')
                  if [ "$ACTUAL_SHA" = "$EXPECTED_SHA" ]; then
                    echo "SHA-256 verification SUCCESS: $ACTUAL_SHA"
                    DOWNLOAD_SUCCESS=1
                    break
                  else
                    echo "SHA-256 verification FAILED: expected $EXPECTED_SHA, got $ACTUAL_SHA"
                    rm -f "$DIST_DIR/gradle-8.13-bin.zip"
                  fi
                fi
              done

              if [ $DOWNLOAD_SUCCESS -ne 1 ]; then
                echo "Failed to download verified Gradle 8.13 distribution from official endpoints."
                exit 1
              fi
            fi
          fi

          ./gradlew --version --no-daemon

      - name: Compile and Assemble Debug APK
        run: |
          ./gradlew :TMessagesProj:compileDebugSources --console=plain --stacktrace
          ./gradlew :TMessagesProj_App:assembleAfatDebug --console=plain --stacktrace

      - name: Locate Debug APK
        id: find_apk
        run: |
          mkdir -p build_output
          find . -name "*.apk" -type f -exec cp {} build_output/ \;
          echo "Found APKs:"
          ls -lah build_output/

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: kiwigram-debug-apk
          path: build_output/*.apk
          if-no-files-found: error
          retention-days: 14

