name: Build Kiwigram Debug APK

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: |
            platform-tools
            platforms;android-36
            build-tools;36.0.0
            ndk;27.2.12479018
            cmake;3.22.1

      - name: Make Gradlew Executable
        run: chmod +x ./gradlew

      - name: Compile and Assemble Debug APK
        run: |
          ./gradlew :TMessagesProj:compileDebugSources --console=plain --stacktrace
          ./gradlew :TMessagesProj_App:assembleAfatDebug --console=plain --stacktrace || ./gradlew assembleDebug --console=plain --stacktrace

      - name: Locate Debug APK
        id: find_apk
        run: |
          mkdir -p build_output
          find . -name "*.apk" -type f -exec cp {} build_output/ \;
          echo "Found APKs:"
          ls -lah build_output/

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: kiwigram-debug-apk
          path: build_output/*.apk
          if-no-files-found: error
          retention-days: 14

