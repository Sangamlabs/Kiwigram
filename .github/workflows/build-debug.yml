name: Build Kiwigram Debug APK

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: recursive

      - name: Restore omitted native dependency checkouts
        shell: bash
        run: |
          set -euo pipefail

          checkout_pinned() {
            local url="$1"
            local path="$2"
            local revision="$3"

            if [ -f "$path/.git" ] || [ -d "$path/.git" ]; then
              echo "Already initialized: $path"
              return
            fi

            if [ -e "$path" ]; then
              echo "Refusing to overwrite existing non-git path: $path" >&2
              exit 1
            fi

            mkdir -p "$(dirname "$path")"
            git init "$path"
            git -C "$path" remote add origin "$url"
            git -C "$path" fetch --depth=1 origin "$revision"
            git -C "$path" checkout --detach FETCH_HEAD
            echo "Checked out $path at $revision"
          }

          # These gitlinks are listed in .gitmodules but were omitted from
          # the Kiwigram superproject tree. Pin to the matching Telegram
          # 13.2.1 upstream tree (DrKLO/Telegram master, 7be672ead283d022812d75c729d3a04dd4c2a2c6).
          checkout_pinned "https://github.com/dkaraush/tlottie.git" "TMessagesProj/jni/tlottie" "31f1b542f88e7b4be9a01e749920d857535fc715"
          checkout_pinned "https://github.com/webmproject/libvpx.git" "TMessagesProj/jni/third_party/libvpx" "6df3ec34557879fff673706f4a1d9fbd0f3a6f0e"
          checkout_pinned "https://github.com/videolan/dav1d.git" "TMessagesProj/jni/third_party/dav1d" "54706fc6bc0cdecab7e9593974a4039cc038fca7"
          checkout_pinned "https://github.com/FFmpeg/FFmpeg.git" "TMessagesProj/jni/third_party/ffmpeg" "8dca1586f468bfcbb78ae3ed618af1361d9f140a"
          checkout_pinned "https://github.com/xiph/ogg.git" "TMessagesProj/jni/third_party/xiph/ogg" "be05b13e98b048f0b5a0f5fa8ce514d56db5f822"
          checkout_pinned "https://github.com/xiph/opusfile.git" "TMessagesProj/jni/third_party/xiph/opusfile" "a55c164e9891a9326188b7d4d216ec9a88373739"
          checkout_pinned "https://github.com/xiph/opus.git" "TMessagesProj/jni/third_party/xiph/opus" "22244de5a79bd1d6d623c32e72bf1954b56235be"
          checkout_pinned "https://chromium.googlesource.com/libyuv/libyuv" "TMessagesProj/jni/third_party/libyuv" "28ce69c2744a6aafdb58564e7b884aec3f66be5f"
          checkout_pinned "https://github.com/cisco/openh264.git" "TMessagesProj/jni/third_party/openh264" "652bdb7719f30b52b08e506645a7322ff1b2cc6f"
          checkout_pinned "https://github.com/google/boringssl.git" "TMessagesProj/jni/third_party/boringssl" "2b44a3701a4788e1ef866ddc7f143060a3d196c9"
          checkout_pinned "https://github.com/tdlib/td.git" "TMessagesProj/jni/td" "022d60202e446ad1287b9fb68e687c8a0760788b"
          checkout_pinned "https://github.com/abseil/abseil-cpp.git" "TMessagesProj/jni/third_party/absl" "54fac219c4ef0bc379dfffb0b8098725d77ac81b"
          checkout_pinned "https://github.com/wasm-micro-runtime/wasm-micro-runtime.git" "TMessagesProj/jni/third_party/wamr" "25bd7eb63e828e4bd242cc9b38d260b4b31c6605"
          checkout_pinned "https://github.com/TelegramMessenger/tgcalls.git" "TMessagesProj/jni/tgcalls" "545f5ae599f8282e1ae3f38aaff166d179d75703"
          checkout_pinned "https://github.com/dkaraush/wallet-engine.git" "TMessagesProj/jni/wallet-engine" "5c65e47cb8d68727c20d89382d0bc51292486b9a"
          checkout_pinned "https://github.com/boostorg/regex.git" "TMessagesProj/jni/third_party/boost-regex" "4cbcd3078e6ae10d05124379623a1bf03fcb9350"
          checkout_pinned "https://github.com/TelegramMessenger/libprisma.git" "TMessagesProj/jni/third_party/libprisma" "94640c63c20eacdf70e37e23198d9ab53c802ebd"

          test -f TMessagesProj/jni/third_party/libyuv/include/libyuv.h
          test -f TMessagesProj/jni/third_party/absl/CMakeLists.txt
          test -f TMessagesProj/jni/third_party/libprisma/libprisma/SyntaxHighlighter.cpp
          test -f TMessagesProj/jni/third_party/boost-regex/include/boost/regex.hpp

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Create CI-only debug keystore
        shell: bash
        run: |
          set -euo pipefail

          KEYSTORE="TMessagesProj/config/release.keystore"
          if [ ! -f "$KEYSTORE" ]; then
            STORE_PASSWORD="$(sed -n 's/^RELEASE_STORE_PASSWORD=//p' gradle.properties | tail -n 1)"
            KEY_PASSWORD="$(sed -n 's/^RELEASE_KEY_PASSWORD=//p' gradle.properties | tail -n 1)"
            KEY_ALIAS="$(sed -n 's/^RELEASE_KEY_ALIAS=//p' gradle.properties | tail -n 1)"

            test -n "$STORE_PASSWORD"
            test -n "$KEY_PASSWORD"
            test -n "$KEY_ALIAS"
            mkdir -p "$(dirname "$KEYSTORE")"

            keytool -genkeypair -noprompt -v \
              -keystore "$KEYSTORE" \
              -storetype JKS \
              -storepass "$STORE_PASSWORD" \
              -alias "$KEY_ALIAS" \
              -keypass "$KEY_PASSWORD" \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Kiwigram CI Debug, OU=Build, O=Sangamlabs, C=IN"

            echo "Generated ephemeral CI debug keystore. Do not use this key for releases."
          else
            echo "Signing keystore already exists; leaving it unchanged."
          fi

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Accept Android SDK Licenses
        run: |
          yes | sdkmanager --licenses || true

      - name: Install Android SDK Components
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;27.2.12479018" \
            "cmake;3.22.1"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Make Gradlew Executable
        run: chmod +x ./gradlew

      - name: Ensure Gradle 8.13 Distribution Ready
        run: |
          DIST_DIR="$HOME/.gradle/wrapper/dists/gradle-8.13-bin/5xuhj0ry160q40clulazy9h7d"
          EXPECTED_SHA="20f1b1176237254a6fc204d8434196fa11a4cfb387567519c61556e8710aed78"

          if [ -f "$DIST_DIR/gradle-8.13-bin.zip.ok" ] && [ -d "$DIST_DIR/gradle-8.13" ]; then
            echo "Gradle 8.13 distribution already present and verified in cache."
          else
            mkdir -p "$DIST_DIR"
            NEED_DOWNLOAD=1
            if [ -f "$DIST_DIR/gradle-8.13-bin.zip" ]; then
              ACTUAL_SHA=$(sha256sum "$DIST_DIR/gradle-8.13-bin.zip" | awk '{print $1}')
              if [ "$ACTUAL_SHA" = "$EXPECTED_SHA" ]; then
                echo "Pre-existing gradle-8.13-bin.zip matches official SHA-256."
                NEED_DOWNLOAD=0
              else
                echo "Cached zip failed checksum, removing."
                rm -f "$DIST_DIR/gradle-8.13-bin.zip"
              fi
            fi

            if [ $NEED_DOWNLOAD -eq 1 ]; then
              echo "Downloading gradle-8.13-bin.zip from official Gradle distribution endpoints..."
              URLS=(
                "https://services.gradle.org/distributions/gradle-8.13-bin.zip"
                "https://downloads.gradle.org/distributions/gradle-8.13-bin.zip"
              )
              DOWNLOAD_SUCCESS=0
              for url in "${URLS[@]}"; do
                echo "Trying official endpoint: $url"
                if curl -fL --retry 3 --retry-delay 5 --retry-connrefused --connect-timeout 30 --max-time 300 -o "$DIST_DIR/gradle-8.13-bin.zip" "$url"; then
                  ACTUAL_SHA=$(sha256sum "$DIST_DIR/gradle-8.13-bin.zip" | awk '{print $1}')
                  if [ "$ACTUAL_SHA" = "$EXPECTED_SHA" ]; then
                    echo "SHA-256 verification SUCCESS: $ACTUAL_SHA"
                    DOWNLOAD_SUCCESS=1
                    break
                  else
                    echo "SHA-256 verification FAILED: expected $EXPECTED_SHA, got $ACTUAL_SHA"
                    rm -f "$DIST_DIR/gradle-8.13-bin.zip"
                  fi
                fi
              done

              if [ $DOWNLOAD_SUCCESS -ne 1 ]; then
                echo "Failed to download verified Gradle 8.13 distribution from official endpoints."
                exit 1
              fi
            fi
          fi

          ./gradlew --version --no-daemon

      - name: Compile and Assemble Debug APK
        run: |
          ./gradlew :TMessagesProj:compileDebugSources --console=plain --stacktrace
          ./gradlew :TMessagesProj_App:assembleAfatDebug --console=plain --stacktrace

      - name: Locate Debug APK
        id: find_apk
        run: |
          mkdir -p build_output
          find . -name "*.apk" -type f -exec cp {} build_output/ \;
          echo "Found APKs:"
          ls -lah build_output/

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: kiwigram-debug-apk
          path: build_output/*.apk
          if-no-files-found: error
          retention-days: 14

